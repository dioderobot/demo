name: PCB Release

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

env:
  PCB_VERSION: "v0.3.42"

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        pcb-version: [HEAD, latest]
    continue-on-error: ${{ matrix.pcb-version == 'HEAD' }}
    runs-on: ubicloud-standard-30-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pcb
        uses: diodeinc/pcb-action/setup@v2
        with:
          version: ${{ matrix.pcb-version }}
      - name: Build .zen files
        run: |
          pcb build . --locked

  detect:
    name: Detect boards
    runs-on: ubicloud-standard-30-ubuntu-2404
    outputs:
      boards: ${{ steps.detect.outputs.boards }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pcb
        uses: diodeinc/pcb-action/setup@v2
        with:
          version: ${{ env.PCB_VERSION }}

      - name: Detect boards
        id: detect
        shell: bash
        run: |
          set -e -o pipefail
          boards=$(pcb info . -f json | jq -c '[.packages[] | select(.config.board != null) | {name: .config.board.name, path: (.rel_path + "/" + .config.board.path)}]')
          echo "boards=$boards" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.board.name }}
    needs: detect
    runs-on: ubicloud-standard-30-ubuntu-2404
    container:
      image: ghcr.io/dioderobot/kicad:53906e16
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.detect.outputs.boards) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: apt-get update && apt-get install -y curl jq git xz-utils xxd

      - name: Fix git permissions
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install pcb
        uses: diodeinc/pcb-action/setup@v2
        with:
          version: ${{ env.PCB_VERSION }}

      - name: Build board
        run: pcb build ${{ matrix.board.path }} -S layout.drc --locked

      - name: Run pcb publish
        id: release
        shell: bash
        run: |
          short_sha=$(git rev-parse --short HEAD)
          pcb publish ${{ matrix.board.path }} -S layout.drc
          archive_path=".pcb/releases/${{ matrix.board.name }}-$short_sha.zip"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          ARTIFACT: ${{ steps.release.outputs.archive_path }}
        run: |
          set -euo pipefail

          SHA256_HEX=$(shasum -a 256 "$ARTIFACT" | cut -d' ' -f1)
          SHA256_BASE64=$(echo -n "$SHA256_HEX" | xxd -r -p | base64)

          OIDC_TOKEN=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.diode.computer/releases" | jq -r '.value')

          UPLOAD_URL=$(curl -sSf -X POST -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://api.diode.computer/api/file/$SHA256_HEX" | jq -r '.uploadUrl')

          curl -sSf -X PUT "$UPLOAD_URL" -H "Content-Type: application/zip" \
            -H "x-amz-checksum-sha256: $SHA256_BASE64" --data-binary @"$ARTIFACT"

          curl -sSf -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" \
            -d "{\"artifactHash\":\"$SHA256_HEX\"}" "https://api.diode.computer/api/releases/github"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: pcb-release-${{ matrix.board.name }}-${{ steps.release.outputs.short_sha }}
          path: ${{ steps.release.outputs.archive_path }}
          retention-days: 30
