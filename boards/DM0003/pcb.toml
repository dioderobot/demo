[board]
name = "DM0003"
description = """
Raspberry Pi Compute Module 5 carrier board.
A feature-rich carrier board for the Raspberry Pi CM5 with comprehensive I/O expansion.
Includes dual HDMI, PCIe M.2 slot, USB-C with Power Delivery, Gigabit Ethernet, MIPI DSI/CSI, and GPIO access.
Ideal for industrial applications, edge computing, and embedded systems requiring CM5 capabilities.
"""

