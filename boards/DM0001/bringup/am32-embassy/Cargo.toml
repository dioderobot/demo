[package]
name = "am32-embassy"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AM32 ESC firmware in Rust using Embassy for DM0001"

[dependencies]
# Embassy framework - use latest versions
embassy-stm32 = { version = "0.5", features = [
    "stm32g431cb",
    "time-driver-any",
    "exti",
    "memory-x",
] }
embassy-executor = { version = "0.9", features = [
    "arch-cortex-m",
    "executor-thread",
] }
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }
embassy-sync = "0.7"
embassy-futures = "0.1"

# Cortex-M support
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

# Embedded HAL traits
embedded-hal = "1.0"
embedded-hal-async = "1.0"

# Logging
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

# Utilities
static_cell = "2"
heapless = "0.8"
fixed = "1.27"

[profile.release]
debug = 2
lto = true
opt-level = "s"

[profile.dev]
debug = 2
opt-level = 1

[[bin]]
name = "am32-embassy"
path = "src/main.rs"
